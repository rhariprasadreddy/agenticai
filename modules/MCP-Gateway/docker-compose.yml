version: '3.8'

services:
  mcp-gateway:
    build: .
    container_name: mcp-gateway
    environment:
      ORCH_URL: http://orchestrator:8081
      API_KEY: dev-key
    ports:
      - "8080:8080"
    depends_on:
      - orchestrator

  orchestrator:
    build:
      context: ../Orchestrator
    container_name: orchestrator
    environment:
      A1_URL: http://a1:9001
      A2_URL: http://a2:9002
      A3_URL: http://a3:9003
      A4_URL: http://a4:9004
      A5_URL: http://a5:9005
    ports:
      - "8081:8081"
    depends_on:
      - a1
      - a2
      - a3
      - a4
      - a5

  # --- A1: THE HEAD DOCTOR (Real) ---
  a1:
    build:
      context: ../A1-DietRules
    container_name: agent-a1
    ports: ["9001:9001"]
    environment:
      PYTHONPATH: /app/app
      DIABETES_RAG_URL: "http://192.168.2.69:9101"
      DIABETES_OV_URL: "http://192.168.2.69:8080"
      LIPIDS_RAG_URL: "http://192.168.2.69:9102"
      LIPIDS_OV_URL: "http://192.168.2.69:8080"
      HTN_RAG_URL: "http://192.168.2.69:9103"
      HTN_OV_URL: "http://192.168.2.69:8080"
      KIDNEY_RAG_URL: "http://192.168.2.69:9104"
      KIDNEY_OV_URL: "http://192.168.2.69:8080"

  # --- A2: THE ANALYST (Dummy - Still Pending) ---
  # --- A2: THE NUTRIENT DETECTIVE (Real) ---
  a2:
    build:
      context: ../A2-Gaps
    container_name: agent-a2
    ports: ["9002:9002"]

  # --- A3: THE TARGET CALCULATOR (Real) ---
  a3:
    build:
      context: ../A3-Targets
    container_name: agent-a3
    ports: ["9003:9003"]

  # --- A4: THE PHARMACIST (Real - NOW ACTIVE) ---
  a4:
    build:
      context: ../A4-Conflicts
    container_name: agent-a4
    ports: ["9004:9004"]

  # --- A5: THE SYNTHESIZER (Real) ---
  a5:
    build:
      context: ../A5-Planner
    container_name: agent-a5
    environment:
      OV_URL: "http://192.168.2.69:8080"
    ports: ["9005:9005"]
# --- FRONTEND ---
  ui:
    build:
      context: ../Frontend
    container_name: agent-ui
    ports:
      - "8501:8501"
    depends_on:
      - orchestrator