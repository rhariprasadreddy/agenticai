version: '3.8'

services:
  # --- 1. MCP GATEWAY (Ingress) ---
  mcp-gateway:
    build: .
    container_name: mcp-gateway
    environment:
      ORCH_URL: http://orchestrator:8081
      API_KEY: dev-key
    ports:
      - "8080:8080"
    depends_on:
      - orchestrator
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    cpuset: "0-3"  # Pinned to NUMA 0 (Cores 0-3)

  # --- 2. ORCHESTRATOR (The Brain) ---
  orchestrator:
    build:
      context: ../Orchestrator
    container_name: orchestrator
    environment:
      # Local Logic Agents (Internal Docker Network)
      A1_URL: http://a1:9001
      A2_URL: http://a2:9002
      A3_URL: http://a3:9003
      A4_URL: http://a4:9004
      A5_URL: http://a5:9005
      # Remote Inference (Xeon Server)
      XEON_INFERENCE_URL: "http://192.168.2.69"
      # Explicit Service Mapping for Orchestrator Logic
      DIABETES_SERVICE: "http://192.168.2.69:8080/v1/diabetes/plan"
      LIPIDS_SERVICE: "http://192.168.2.69:9006/v1/lipids/plan"
      KIDNEY_SERVICE: "http://192.168.2.69:9008/v1/kidney/plan"
      HTN_SERVICE: "http://192.168.2.69:8082/generate"
    ports:
      - "8081:8081"
    depends_on:
      - a1
      - a2
      - a3
      - a4
      - a5
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    cpuset: "4-7"  # Pinned to NUMA 0 (Cores 4-7)

  # --- 3. FRONTEND UI ---
  ui:
    build:
      context: ../Frontend
    container_name: agent-ui
    ports:
      - "8501:8501"
    depends_on:
      - orchestrator
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    cpuset: "8-11" # Pinned to NUMA 0 (Cores 8-11)

  # --- 4. A1: THE HEAD DOCTOR (Rules Engine) ---
  a1:
    build:
      context: ../A1-DietRules
    container_name: agent-a1
    ports: ["9001:9001"]
    environment:
      PYTHONPATH: /app/app
      # RAG & KG on Xeon (Port check: RAGs are 9101-9104)
      DIABETES_RAG_URL: "http://192.168.2.69:9101"
      LIPIDS_RAG_URL: "http://192.168.2.69:9102"
      HTN_RAG_URL: "http://192.168.2.69:9103"
      KIDNEY_RAG_URL: "http://192.168.2.69:9104"
      # Agent Endpoints on Xeon (Port check verified)
      DIABETES_OV_URL: "http://192.168.2.69:8080"
      LIPIDS_OV_URL: "http://192.168.2.69:9006"
      HTN_OV_URL: "http://192.168.2.69:8082"
      KIDNEY_OV_URL: "http://192.168.2.69:9008"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    cpuset: "12-13"

  # --- 5. A2: THE NUTRIENT DETECTIVE ---
  a2:
    build:
      context: ../A2-Gaps
    container_name: agent-a2
    ports: ["9002:9002"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    cpuset: "14-15"

  # --- 6. A3: THE TARGET CALCULATOR ---
  a3:
    build:
      context: ../A3-Targets
    container_name: agent-a3
    ports: ["9003:9003"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    cpuset: "16-17"

  # --- 7. A4: THE PHARMACIST ---
  a4:
    build:
      context: ../A4-Conflicts
    container_name: agent-a4
    ports: ["9004:9004"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    cpuset: "18-19"

  # --- 8. A5: THE SYNTHESIZER (Planner) ---
  a5:
    build:
      context: ../A5-Planner
    container_name: agent-a5
    environment:
      # Planner might need general access to default agent
      OV_URL: "http://192.168.2.69:8080"
    ports: ["9005:9005"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    cpuset: "20-21"